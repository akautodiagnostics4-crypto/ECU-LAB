name: Build AK ECU SIGNAL LAB APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:

      # --------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------
      - name: Checkout source
        uses: actions/checkout@v4


      # --------------------------------------------------
      # 2. Node.js
      # --------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm


      # --------------------------------------------------
      # 3. Java 17
      # --------------------------------------------------
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle


      # --------------------------------------------------
      # 4. Android SDK
      # --------------------------------------------------
      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          if [ ! -d "$ANDROID_HOME" ]; then
            echo "ERROR: Android SDK not found"
            exit 1
          fi

          echo "Android SDK found"


      # --------------------------------------------------
      # 5. Install Android SDK packages
      # --------------------------------------------------
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"


      # --------------------------------------------------
      # 6. Install JavaScript dependencies
      # --------------------------------------------------
      - name: Install npm dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi


      # --------------------------------------------------
      # 7. Check project type
      # --------------------------------------------------
      - name: Check Android project
        shell: bash
        run: |
          echo "Checking project..."

          if [ -f "android/gradlew" ]; then
            echo "Existing Android project found."
            echo "BUILD_TYPE=existing" >> "$GITHUB_ENV"

          elif node -e "const p=require('./package.json'); process.exit(p.dependencies?.expo || p.devDependencies?.expo ? 0 : 1)" 2>/dev/null; then
            echo "Expo project detected."
            echo "BUILD_TYPE=expo" >> "$GITHUB_ENV"

          else
            echo "ERROR: No Android Gradle project and no Expo project found."
            echo ""
            echo "Expected either:"
            echo "  android/gradlew"
            echo "or"
            echo "  Expo dependency in package.json"
            exit 1
          fi


      # --------------------------------------------------
      # 8. Create Android project if required
      # --------------------------------------------------
      - name: Generate Android project
        if: env.BUILD_TYPE == 'expo'
        run: |
          echo "Generating Android project..."

          npx expo prebuild \
            --platform android \
            --non-interactive

          echo "Expo Android project generated."


      # --------------------------------------------------
      # 9. Verify Gradle wrapper
      # --------------------------------------------------
      - name: Verify Gradle wrapper
        shell: bash
        run: |
          if [ ! -f "android/gradlew" ]; then
            echo "ERROR: android/gradlew was not created."
            echo ""
            echo "Android directory contents:"
            find android -maxdepth 2 -type f | head -100 || true
            exit 1
          fi

          echo "Gradle wrapper found:"
          ls -lh android/gradlew


      # --------------------------------------------------
      # 10. Make Gradle executable
      # --------------------------------------------------
      - name: Make Gradle executable
        run: chmod +x android/gradlew


      # --------------------------------------------------
      # 11. Clean Gradle
      # --------------------------------------------------
      - name: Clean Gradle
        working-directory: android
        run: ./gradlew clean --no-daemon


      # --------------------------------------------------
      # 12. Build APK
      # --------------------------------------------------
      - name: Build Debug APK
        working-directory: android
        run: |
          ./gradlew assembleDebug \
            --stacktrace \
            --no-daemon


      # --------------------------------------------------
      # 13. Find APK
      # --------------------------------------------------
      - name: Find APK
        shell: bash
        run: |
          echo "Searching for APK..."

          find android \
            -type f \
            -name "*.apk" \
            -print


      # --------------------------------------------------
      # 14. Upload APK
      # --------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AK-ECU-SIGNAL-LAB-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
